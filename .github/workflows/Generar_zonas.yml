```yaml
name: Actualiza zonas horarias

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

jobs:
  update-raid-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytz

      - name: Run Python Script
        run: python gen.py

      - name: Move JSON File to Working Directory
        run: mv temp/datalugares.json ./

      - name: Modify JSON File
        run: echo "" >> datalugares.json

      - name: Commit JSON Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git switch --orphan data
          git add datalugares.json
          git commit -m "Datos actualizados 🤖🍺"

      - name: Push Data Branch
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: data
          force: true
```
